name: Render Fortnite Video

on:
  workflow_dispatch:
    inputs:
      concept_id:
        description: "Concept ID"
        required: true
        type: string

      clip1_url:
        description: "URL clip 1"
        required: true
        type: string
      clip1_trim_start:
        description: "Trim start clip 1"
        required: true
        default: "0"
        type: string
      clip1_duration:
        description: "Durata finale clip 1"
        required: true
        default: "4"
        type: string

      clip2_url:
        description: "URL clip 2"
        required: true
        type: string
      clip2_trim_start:
        description: "Trim start clip 2"
        required: true
        default: "0"
        type: string
      clip2_duration:
        description: "Durata finale clip 2"
        required: true
        default: "2"
        type: string

      clip3_url:
        description: "URL clip 3"
        required: true
        type: string
      clip3_trim_start:
        description: "Trim start clip 3"
        required: true
        default: "0"
        type: string
      clip3_duration:
        description: "Durata finale clip 3"
        required: true
        default: "4"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download clips
        env:
          CLIP1_URL: ${{ inputs.clip1_url }}
          CLIP2_URL: ${{ inputs.clip2_url }}
          CLIP3_URL: ${{ inputs.clip3_url }}
        run: |
          curl -L "$CLIP1_URL" -o clip1.mp4
          curl -L "$CLIP2_URL" -o clip2.mp4
          curl -L "$CLIP3_URL" -o clip3.mp4

      - name: Prepare clip 1
        env:
          START: ${{ inputs.clip1_trim_start }}
          DURATION: ${{ inputs.clip1_duration }}
        run: |
          ffmpeg -y \
            -ss "$START" \
            -i clip1.mp4 \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -r 30 \
            -c:v libx264 \
            -preset fast \
            -crf 20 \
            -c:a aac \
            -ar 48000 \
            -ac 2 \
            prepared1.mp4

      - name: Prepare clip 2
        env:
          START: ${{ inputs.clip2_trim_start }}
          DURATION: ${{ inputs.clip2_duration }}
        run: |
          ffmpeg -y \
            -ss "$START" \
            -i clip2.mp4 \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -r 30 \
            -c:v libx264 \
            -preset fast \
            -crf 20 \
            -c:a aac \
            -ar 48000 \
            -ac 2 \
            prepared2.mp4

      - name: Prepare clip 3
        env:
          START: ${{ inputs.clip3_trim_start }}
          DURATION: ${{ inputs.clip3_duration }}
        run: |
          ffmpeg -y \
            -ss "$START" \
            -i clip3.mp4 \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -r 30 \
            -c:v libx264 \
            -preset fast \
            -crf 20 \
            -c:a aac \
            -ar 48000 \
            -ac 2 \
            prepared3.mp4

      - name: Create concat list
        run: |
          printf "file 'prepared1.mp4'\nfile 'prepared2.mp4'\nfile 'prepared3.mp4'\n" > clips.txt

      - name: Render final video
        run: |
          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i clips.txt \
            -c copy \
            final.mp4

      - name: Upload final video to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONCEPT_ID: ${{ inputs.concept_id }}
        run: |
          FILE_PATH="final-videos/concept-${CONCEPT_ID}.mp4"

          curl --fail-with-body \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/content-clips/${FILE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary "@final.mp4"

          FINAL_URL="${SUPABASE_URL}/storage/v1/object/public/content-clips/${FILE_PATH}"

          echo "FINAL_VIDEO_URL=${FINAL_URL}" >> "$GITHUB_ENV"
          echo "### Final video" >> "$GITHUB_STEP_SUMMARY"
          echo "${FINAL_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
          retention-days: 1
