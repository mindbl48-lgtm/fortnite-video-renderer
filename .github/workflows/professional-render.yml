name: Professional Video Render

on:
  workflow_dispatch:
    inputs:
      concept_id:
        description: "Concept ID"
        required: true
        type: string

      clips_json:
        description: "Professional edit plan clips JSON"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CONCEPT_ID: ${{ inputs.concept_id }}
      CLIPS_JSON: ${{ inputs.clips_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Create render script
        run: |
          cat > render_professional.py <<'PYTHON'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          clips = json.loads(os.environ["CLIPS_JSON"])

          if not isinstance(clips, list) or not clips:
              raise RuntimeError("clips_json non contiene clip valide")

          clips = sorted(clips, key=lambda x: x["clip_order"])

          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          SFX_DIR = Path("assets/sfx")

          ALLOWED_SFX = {
              "splash",
              "click",
              "whoosh",
              "bass_hit",
              "ui_pop",
              "riser",
              "impact",
          }

          def run(cmd):
              print("\nRUN:")
              print(" ".join(str(x) for x in cmd))
              subprocess.run(cmd, check=True)

          def escape_drawtext(text):
              return (
                  str(text)
                  .replace("\\", "\\\\")
                  .replace(":", "\\:")
                  .replace("'", "\\'")
                  .replace("%", "\\%")
              )

          def position_expression(position):
              positions = {
                  "top": ("(w-text_w)/2", "120"),
                  "top-center": ("(w-text_w)/2", "120"),
                  "center": ("(w-text_w)/2", "(h-text_h)/2"),
                  "bottom": ("(w-text_w)/2", "h-text_h-260"),
                  "bottom-center": ("(w-text_w)/2", "h-text_h-260"),
                  "centro": ("(w-text_w)/2", "(h-text_h)/2"),
                  "alto": ("(w-text_w)/2", "120"),
                  "centro-basso": ("(w-text_w)/2", "h-text_h-260"),
              }

              return positions.get(
                  position,
                  ("(w-text_w)/2", "h-text_h-260")
              )

          def has_audio(filename):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-select_streams", "a",
                      "-show_entries", "stream=index",
                      "-of", "csv=p=0",
                      filename,
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              return bool(result.stdout.strip())

          prepared_files = []

          # ==========================================================
          # 1. PREPARAZIONE CLIP
          # ==========================================================

          for index, clip in enumerate(clips, start=1):
              source_url = clip["source_file_url"]

              source_file = f"source_{index}.mp4"
              output_file = f"prepared_{index}.mp4"

              print(f"Downloading clip {index}: {source_url}")
              urllib.request.urlretrieve(source_url, source_file)

              trim_start = float(
                  clip.get("trim_start_seconds", 0)
              )

              trim_end = float(
                  clip.get("trim_end_seconds", 0)
              )

              source_duration = trim_end - trim_start

              if source_duration <= 0:
                  raise RuntimeError(
                      f"Durata sorgente non valida nella clip {index}"
                  )

              speed = float(
                  clip.get("speed", 1.0)
              )

              if speed <= 0:
                  raise RuntimeError(
                      f"Speed non valida nella clip {index}"
                  )

              final_duration = source_duration / speed

              filters = [
                  "scale=1080:1920:force_original_aspect_ratio=decrease",
                  "pad=1080:1920:(ow-iw)/2:(oh-ih)/2",
                  "setsar=1",
                  "fps=30",
              ]

              if abs(speed - 1.0) > 0.001:
                  filters.append(
                      f"setpts=PTS/{speed}"
                  )

              # ======================================================
              # TESTI A SCHERMO
              # ======================================================

              overlays = clip.get("text_overlays") or []

              for overlay in overlays:
                  text = str(
                      overlay.get("text", "")
                  ).strip()

                  if not text:
                      continue

                  start = float(
                      overlay.get("start_seconds", 0)
                  )

                  end = float(
                      overlay.get(
                          "end_seconds",
                          final_duration
                      )
                  )

                  position = overlay.get(
                      "position",
                      "bottom-center"
                  )

                  x, y = position_expression(position)

                  escaped_text = escape_drawtext(text)

                  filters.append(
                      "drawtext="
                      f"fontfile='{FONT}':"
                      f"text='{escaped_text}':"
                      "fontsize=58:"
                      "fontcolor=white:"
                      "borderw=5:"
                      "bordercolor=black:"
                      f"x='{x}':"
                      f"y='{y}':"
                      f"enable='between(t,{start},{end})'"
                  )

              filter_chain = ",".join(filters)

              source_has_audio = has_audio(source_file)

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-ss", str(trim_start),
                  "-i", source_file,
                  "-t", str(source_duration),
              ]

              # Se la clip NON contiene audio,
              # creiamo una traccia silenziosa.
              if not source_has_audio:
                  cmd += [
                      "-f", "lavfi",
                      "-t", str(final_duration),
                      "-i",
                      "anullsrc=channel_layout=stereo:sample_rate=48000"
                  ]

              cmd += [
                  "-vf", filter_chain,
              ]

              if source_has_audio and abs(speed - 1.0) > 0.001:
                  cmd += [
                      "-af",
                      f"atempo={speed}",
                  ]

              cmd += [
                  "-map", "0:v:0",
              ]

              if source_has_audio:
                  cmd += [
                      "-map", "0:a:0",
                  ]
              else:
                  cmd += [
                      "-map", "1:a:0",
                  ]

              cmd += [
                  "-r", "30",
                  "-c:v", "libx264",
                  "-preset", "fast",
                  "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-ar", "48000",
                  "-ac", "2",
                  "-shortest",
                  output_file,
              ]

              run(cmd)

              prepared_files.append(output_file)

          # ==========================================================
          # 2. CONCAT CLIP
          # ==========================================================

          with open(
              "concat.txt",
              "w",
              encoding="utf-8"
          ) as f:
              for filename in prepared_files:
                  absolute = Path(filename).resolve()
                  f.write(
                      f"file '{absolute}'\n"
                  )

          run([
              "ffmpeg",
              "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat.txt",

              "-c:v", "libx264",
              "-preset", "fast",
              "-crf", "20",
              "-pix_fmt", "yuv420p",

              "-c:a", "aac",
              "-b:a", "192k",
              "-ar", "48000",
              "-ac", "2",

              "-movflags", "+faststart",

              "base_video.mp4",
          ])

          # ==========================================================
          # 3. RACCOLTA SFX DAL PIANO AI
          # ==========================================================

          sfx_events = []

          for clip in clips:
              timeline_start = float(
                  clip.get(
                      "timeline_start_seconds",
                      0
                  )
              )

              for sfx in clip.get("sfx") or []:
                  sfx_type = str(
                      sfx.get("type", "")
                  ).strip()

                  if sfx_type not in ALLOWED_SFX:
                      print(
                          f"SFX ignorato perché non supportato: {sfx_type}"
                      )
                      continue

                  local_time = float(
                      sfx.get(
                          "at_seconds",
                          0
                      )
                  )

                  global_time = (
                      timeline_start
                      + local_time
                  )

                  volume_db = float(
                      sfx.get(
                          "volume_db",
                          -6
                      )
                  )

                  filename = (
                      SFX_DIR
                      / f"{sfx_type}.wav"
                  )

                  if not filename.exists():
                      raise RuntimeError(
                          f"File SFX mancante: {filename}"
                      )

                  sfx_events.append({
                      "type": sfx_type,
                      "filename": str(filename),
                      "time": global_time,
                      "volume_db": volume_db,
                  })

          print("\nSFX EVENTS:")
          print(
              json.dumps(
                  sfx_events,
                  indent=2
              )
          )

          # ==========================================================
          # 4. MIX SFX
          # ==========================================================

          if not sfx_events:
              run([
                  "ffmpeg",
                  "-y",
                  "-i", "base_video.mp4",
                  "-c", "copy",
                  "final.mp4",
              ])

          else:
              cmd = [
                  "ffmpeg",
                  "-y",
                  "-i", "base_video.mp4",
              ]

              for event in sfx_events:
                  cmd += [
                      "-i",
                      event["filename"],
                  ]

              filter_parts = []

              # Abbassiamo leggermente il gameplay
              # per lasciare spazio agli SFX.
              filter_parts.append(
                  "[0:a]"
                  "volume=-2dB"
                  "[game]"
              )

              mix_labels = [
                  "[game]"
              ]

              for i, event in enumerate(
                  sfx_events,
                  start=1
              ):
                  delay_ms = int(
                      round(
                          event["time"] * 1000
                      )
                  )

                  label = f"sfx{i}"

                  filter_parts.append(
                      f"[{i}:a]"
                      "aresample=48000,"
                      f"volume={event['volume_db']}dB,"
                      f"adelay={delay_ms}:all=1"
                      f"[{label}]"
                  )

                  mix_labels.append(
                      f"[{label}]"
                  )

              inputs_string = "".join(
                  mix_labels
              )

              filter_parts.append(
                  f"{inputs_string}"
                  f"amix=inputs={len(mix_labels)}:"
                  "duration=first:"
                  "dropout_transition=0,"
                  "alimiter=limit=0.95"
                  "[mixed]"
              )

              filter_complex = ";".join(
                  filter_parts
              )

              cmd += [
                  "-filter_complex",
                  filter_complex,

                  "-map", "0:v:0",
                  "-map", "[mixed]",

                  "-c:v", "copy",

                  "-c:a", "aac",
                  "-b:a", "192k",
                  "-ar", "48000",
                  "-ac", "2",

                  "-movflags", "+faststart",

                  "final.mp4",
              ]

              run(cmd)

          print(
              "\nProfessional render V3 + SFX completed."
          )
          PYTHON

      - name: Render professional video with SFX
        run: |
          python3 render_professional.py

      - name: Verify final video
        run: |
          echo "Final duration:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final.mp4

          echo "Streams:"
          ffprobe \
            -v error \
            -show_entries stream=codec_type,codec_name \
            -of default=noprint_wrappers=1 \
            final.mp4

      - name: Upload professional video to Supabase
        run: |
          STORAGE_PATH="content-clips/professional-final-videos/concept-${CONCEPT_ID}-sfx.mp4"

          curl --fail --show-error --silent \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/${STORAGE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary "@final.mp4"

          PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/${STORAGE_PATH}"

          echo "PUBLIC_URL=${PUBLIC_URL}" >> "$GITHUB_ENV"

      - name: Add render URL to summary
        run: |
          echo "## Professional Render V3 + SFX" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Concept: ${CONCEPT_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: professional-video-sfx-${{ inputs.concept_id }}
          path: final.mp4
          retention-days: 1
