name: Professional Video Render

on:
  workflow_dispatch:
    inputs:
      concept_id:
        description: "Concept ID"
        required: true
        type: string

      clips_json:
        description: "Professional edit plan clips JSON"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CONCEPT_ID: ${{ inputs.concept_id }}
      CLIPS_JSON: ${{ inputs.clips_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Create render script
        run: |
          cat > render_professional.py <<'PYTHON'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          clips = json.loads(os.environ["CLIPS_JSON"])

          if not isinstance(clips, list) or not clips:
              raise RuntimeError("clips_json non contiene clip valide")

          clips = sorted(clips, key=lambda x: x["clip_order"])

          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          def run(cmd):
              print("RUN:", " ".join(cmd))
              subprocess.run(cmd, check=True)

          def escape_drawtext(text):
              return (
                  str(text)
                  .replace("\\", "\\\\")
                  .replace(":", "\\:")
                  .replace("'", "\\'")
                  .replace("%", "\\%")
              )

          def position_expression(position):
              positions = {
                  "top": ("(w-text_w)/2", "120"),
                  "top-center": ("(w-text_w)/2", "120"),
                  "center": ("(w-text_w)/2", "(h-text_h)/2"),
                  "bottom": ("(w-text_w)/2", "h-text_h-260"),
                  "bottom-center": ("(w-text_w)/2", "h-text_h-260"),
                  "centro": ("(w-text_w)/2", "(h-text_h)/2"),
                  "alto": ("(w-text_w)/2", "120"),
                  "centro-basso": ("(w-text_w)/2", "h-text_h-260"),
              }

              return positions.get(
                  position,
                  ("(w-text_w)/2", "h-text_h-260")
              )

          prepared_files = []

          for index, clip in enumerate(clips, start=1):
              source_url = clip["source_file_url"]

              source_file = f"source_{index}.mp4"
              output_file = f"prepared_{index}.mp4"

              print(f"Downloading clip {index}: {source_url}")
              urllib.request.urlretrieve(source_url, source_file)

              trim_start = float(clip.get("trim_start_seconds", 0))
              trim_end = float(clip.get("trim_end_seconds", 0))
              source_duration = trim_end - trim_start

              if source_duration <= 0:
                  raise RuntimeError(
                      f"Durata sorgente non valida nella clip {index}"
                  )

              speed = float(clip.get("speed", 1.0))

              if speed <= 0:
                  raise RuntimeError(
                      f"Speed non valida nella clip {index}"
                  )

              filters = []

              # Video verticale 1080x1920 senza bloccare i frame.
              filters.append(
                  "scale=1080:1920:force_original_aspect_ratio=decrease"
              )
              filters.append(
                  "pad=1080:1920:(ow-iw)/2:(oh-ih)/2"
              )
              filters.append("setsar=1")
              filters.append("fps=30")

              # Speed costante.
              if abs(speed - 1.0) > 0.001:
                  filters.append(f"setpts=PTS/{speed}")

              final_duration = source_duration / speed

              # Overlay testuali semplici.
              overlays = clip.get("text_overlays") or []

              for overlay in overlays:
                  text = str(overlay.get("text", "")).strip()

                  if not text:
                      continue

                  start = float(overlay.get("start_seconds", 0))
                  end = float(
                      overlay.get(
                          "end_seconds",
                          final_duration
                      )
                  )

                  position = overlay.get(
                      "position",
                      "bottom-center"
                  )

                  x, y = position_expression(position)

                  escaped_text = escape_drawtext(text)

                  filters.append(
                      "drawtext="
                      f"fontfile='{FONT}':"
                      f"text='{escaped_text}':"
                      "fontsize=58:"
                      "fontcolor=white:"
                      "borderw=5:"
                      "bordercolor=black:"
                      f"x='{x}':"
                      f"y='{y}':"
                      f"enable='between(t,{start},{end})'"
                  )

              filter_chain = ",".join(filters)

              # Audio:
              # se speed != 1, adegua anche l'audio con atempo.
              audio_filter = None

              if abs(speed - 1.0) > 0.001:
                  if 0.5 <= speed <= 2.0:
                      audio_filter = f"atempo={speed}"
                  else:
                      raise RuntimeError(
                          f"Speed audio non supportata nella clip {index}: {speed}"
                      )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-ss",
                  str(trim_start),
                  "-i",
                  source_file,
                  "-t",
                  str(source_duration),
                  "-vf",
                  filter_chain,
              ]

              if audio_filter:
                  cmd += [
                      "-af",
                      audio_filter,
                  ]

              cmd += [
                  "-r",
                  "30",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "fast",
                  "-crf",
                  "20",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-ar",
                  "48000",
                  "-ac",
                  "2",
                  "-shortest",
                  output_file,
              ]

              run(cmd)

              prepared_files.append(output_file)

          # Concat manifest.
          with open("concat.txt", "w", encoding="utf-8") as f:
              for filename in prepared_files:
                  f.write(f"file '{Path(filename).resolve()}'\n")

          # Concatenazione con re-encode finale per evitare problemi
          # di timestamp/audio tra clip diverse.
          run([
              "ffmpeg",
              "-y",
              "-f",
              "concat",
              "-safe",
              "0",
              "-i",
              "concat.txt",
              "-c:v",
              "libx264",
              "-preset",
              "fast",
              "-crf",
              "20",
              "-pix_fmt",
              "yuv420p",
              "-c:a",
              "aac",
              "-b:a",
              "192k",
              "-ar",
              "48000",
              "-ac",
              "2",
              "-movflags",
              "+faststart",
              "final.mp4",
          ])

          print("Professional render V2 completed.")
          PYTHON

      - name: Render professional video
        run: |
          python3 render_professional.py

      - name: Verify final video
        run: |
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final.mp4

      - name: Upload professional video to Supabase
        run: |
          STORAGE_PATH="content-clips/professional-final-videos/concept-${CONCEPT_ID}.mp4"

          curl --fail --show-error --silent \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/${STORAGE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary "@final.mp4"

          PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/${STORAGE_PATH}"

          echo "PUBLIC_URL=${PUBLIC_URL}" >> "$GITHUB_ENV"

      - name: Add render URL to summary
        run: |
          echo "## Professional Render V2" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Concept: ${CONCEPT_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: professional-video-${{ inputs.concept_id }}
          path: final.mp4
          retention-days: 1
